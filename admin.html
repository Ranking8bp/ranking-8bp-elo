<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Ranking 8BP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#05090a;color:white}
.container{max-width:1100px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;background:#081012;border:1px solid #1b3034;border-radius:14px;padding:18px 22px;margin-bottom:20px}
.logo{font-size:24px;font-weight:bold}.logo span{color:#9cff00}
button{border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-weight:bold}
.btn-green{background:#9cff00;color:#000}.btn-red{background:#ff3030;color:white}.btn-gray{background:#263437;color:white}
.login-box,.admin-box,.editor-box{background:#081012;border:1px solid #1b3034;border-radius:15px;padding:25px}
.login-box{max-width:420px;margin:80px auto}
h1,h2,h3{margin-top:0}
input,select{width:100%;padding:13px;margin:8px 0 15px;border-radius:8px;border:1px solid #294348;background:#05090a;color:white}
label{display:block;font-weight:bold;margin-top:10px}
.hidden{display:none}
.player{display:flex;justify-content:space-between;align-items:center;border:1px solid #1b3034;padding:15px;border-radius:10px;margin-top:10px}
.player-info{display:flex;align-items:center;gap:15px}.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#222}
.actions{display:flex;gap:8px}.editor-box{margin-top:20px}.editor-buttons{display:flex;gap:10px;margin-top:15px}
.error{color:#ff5252;margin-top:10px}.success{color:#9cff00;margin-top:10px}
.user-info{color:#aaa;font-size:13px;margin-top:5px}
@media(max-width:600px){
header{flex-direction:column;align-items:flex-start;gap:15px}header button{width:100%}
.player{flex-direction:column;align-items:flex-start;gap:15px}.actions{width:100%}.actions button{flex:1}
.editor-buttons{flex-direction:column}.editor-buttons button{width:100%}
}
</style>
</head>
<body>
<div class="container">

<div id="loginSection" class="login-box">
<h1>🔐 ADMIN <span style="color:#9cff00;">8BP</span></h1>
<p>Panel de administración del Ranking 8BP</p>
<label>Correo</label>
<input type="email" id="email" placeholder="Correo del administrador">
<label>Contraseña</label>
<input type="password" id="password" placeholder="Contraseña">
<button class="btn-green" onclick="login()">ENTRAR</button>
<div id="loginError" class="error"></div>
</div>

<div id="adminSection" class="hidden">
<header>
<div>
<div class="logo">RANKING <span>8BP</span> ADMIN</div>
<div id="adminEmail" class="user-info"></div>
</div>
<button class="btn-red" onclick="logout()">CERRAR SESIÓN</button>
</header>

<div class="admin-box">
<h2>👥 Jugadores</h2>
<button class="btn-green" onclick="nuevoJugador()">+ AGREGAR JUGADOR</button>
<div id="playersList">Cargando jugadores...</div>
</div>

<div id="editor" class="editor-box hidden">
<h2 id="editorTitle">Editar jugador</h2>
<input type="hidden" id="playerId">

<label>Nombre</label>
<input type="text" id="nombre" placeholder="Nombre del jugador">

<label>País</label>
<input type="text" id="pais" placeholder="Ejemplo: Ecuador">

<label>Código del país</label>
<input type="text" id="codigoPais" placeholder="Ejemplo: EC" maxlength="2">

<label>Foto / Avatar</label>
<input type="text" id="foto" placeholder="URL de la foto">

<label>ELO</label>
<input type="number" id="elo" value="1000">

<label>Victorias</label>
<input type="number" id="victorias" value="0">

<label>Derrotas</label>
<input type="number" id="derrotas" value="0">

<label>Racha</label>
<input type="number" id="racha" value="0">

<label>Último resultado</label>
<select id="ultimoResultado">
<option value="">Sin partido</option>
<option value="VICTORIA">VICTORIA</option>
<option value="DERROTA">DERROTA</option>
</select>

<label>Último rival</label>
<input type="text" id="ultimoRival" placeholder="Nombre del rival">

<div class="editor-buttons">
<button class="btn-green" onclick="guardarJugador()">💾 GUARDAR</button>
<button class="btn-gray" onclick="cancelarEdicion()">CANCELAR</button>
<button class="btn-red" onclick="eliminarJugador()">🗑️ ELIMINAR</button>
</div>
<div id="editorMessage" class="success"></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, remove }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyAewmp-duXpfMyL9MenMGxKOAGuUi96phs",
authDomain:"raking8bp.firebaseapp.com",
databaseURL:"https://raking8bp-default-rtdb.firebaseio.com",
projectId:"raking8bp",
storageBucket:"raking8bp.firebasestorage.app",
messagingSenderId:"448167900361",
appId:"1:448167900361:web:9eaa6b20b0fa21108bc918",
measurementId:"G-HVR8GD1RF1"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const database=getDatabase(app);

window.login=async function(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const error=document.getElementById("loginError");
error.textContent="";
if(!email||!password){error.textContent="Escribe tu correo y contraseña.";return}
try{
await signInWithEmailAndPassword(auth,email,password);
}catch(e){
console.error(e);
if(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found"){
error.textContent="Correo o contraseña incorrectos.";
}else if(e.code==="auth/invalid-api-key"){
error.textContent="Error de configuración de Firebase.";
}else if(e.code==="auth/operation-not-allowed"){
error.textContent="El acceso por correo y contraseña no está habilitado.";
}else{
error.textContent="Error de Firebase: "+(e.code||e.message);
}
}
};

window.logout=async function(){await signOut(auth)};

onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("loginSection").classList.add("hidden");
document.getElementById("adminSection").classList.remove("hidden");
document.getElementById("adminEmail").textContent="Administrador: "+(user.email||"");
cargarJugadores();
}else{
document.getElementById("loginSection").classList.remove("hidden");
document.getElementById("adminSection").classList.add("hidden");
}
});

function cargarJugadores(){
const jugadoresRef=ref(database,"jugadores");
onValue(jugadoresRef,(snapshot)=>{
const data=snapshot.val();
const container=document.getElementById("playersList");
container.innerHTML="";
if(!data){container.innerHTML="<p>No hay jugadores registrados todavía.</p>";return}
Object.entries(data).forEach(([id,jugador])=>{
const div=document.createElement("div");
div.className="player";
const foto=jugador.foto||"";
div.innerHTML=`
<div class="player-info">
<img class="avatar" src="${foto}" onerror="this.style.visibility='hidden'">
<div>
<strong>${jugador.nombre||"Sin nombre"}</strong><br>
<small>${jugador.codigoPais||""} ${jugador.pais||""} · ELO: ${jugador.elo||1000}<br>
🟢 ${jugador.victorias||0} / 🔴 ${jugador.derrotas||0}</small>
</div>
</div>
<div class="actions"><button class="btn-green" onclick="editarJugador('${id}')">✏️ EDITAR</button></div>`;
container.appendChild(div);
});
});
}

function limpiarEditor(){
["nombre","pais","codigoPais","foto","elo","victorias","derrotas","racha","ultimoResultado","ultimoRival"].forEach(id=>{
const el=document.getElementById(id); if(el) el.value="";
});
document.getElementById("elo").value=1000;
document.getElementById("victorias").value=0;
document.getElementById("derrotas").value=0;
document.getElementById("racha").value=0;
document.getElementById("ultimoResultado").value="";
document.getElementById("editorMessage").textContent="";
}

window.nuevoJugador=function(){
limpiarEditor();
document.getElementById("editorTitle").textContent="➕ Nuevo jugador";
document.getElementById("playerId").value="";
document.getElementById("editor").classList.remove("hidden");
document.getElementById("editor").scrollIntoView({behavior:"smooth"});
};

window.editarJugador=function(id){
const jugadorRef=ref(database,"jugadores/"+id);
onValue(jugadorRef,(snapshot)=>{
const jugador=snapshot.val();
if(!jugador){alert("No se encontró el jugador.");return}
document.getElementById("editor").classList.remove("hidden");
document.getElementById("editorTitle").textContent="✏️ Editar jugador";
document.getElementById("playerId").value=id;
document.getElementById("nombre").value=jugador.nombre||"";
document.getElementById("pais").value=jugador.pais||"";
document.getElementById("codigoPais").value=jugador.codigoPais||"";
document.getElementById("foto").value=jugador.foto||"";
document.getElementById("elo").value=jugador.elo??1000;
document.getElementById("victorias").value=jugador.victorias??0;
document.getElementById("derrotas").value=jugador.derrotas??0;
document.getElementById("racha").value=jugador.racha??0;
document.getElementById("ultimoResultado").value=jugador.ultimoResultado||"";
document.getElementById("ultimoRival").value=jugador.ultimoRival||"";
document.getElementById("editorMessage").textContent="";
document.getElementById("editor").scrollIntoView({behavior:"smooth"});
},{onlyOnce:true});
};

window.guardarJugador=async function(){
const id=document.getElementById("playerId").value.trim();
const nombre=document.getElementById("nombre").value.trim();
if(!nombre){alert("Escribe el nombre del jugador.");return}
const jugadorId=id||"jugador_"+Date.now();
const jugador={
nombre,
pais:document.getElementById("pais").value.trim(),
codigoPais:document.getElementById("codigoPais").value.trim().toUpperCase(),
foto:document.getElementById("foto").value.trim(),
elo:Number(document.getElementById("elo").value)||1000,
victorias:Number(document.getElementById("victorias").value)||0,
derrotas:Number(document.getElementById("derrotas").value)||0,
racha:Number(document.getElementById("racha").value)||0,
ultimoResultado:document.getElementById("ultimoResultado").value,
ultimoRival:document.getElementById("ultimoRival").value.trim()
};
try{
await set(ref(database,"jugadores/"+jugadorId),jugador);
document.getElementById("editorMessage").textContent="✅ Jugador guardado correctamente.";
setTimeout(cancelarEdicion,800);
}catch(error){console.error(error);alert("No se pudo guardar el jugador: "+error.message)}
};

window.cancelarEdicion=function(){
document.getElementById("editor").classList.add("hidden");
};

window.eliminarJugador=async function(){
const id=document.getElementById("playerId").value;
if(!id){alert("Este jugador todavía no ha sido guardado.");return}
const nombre=document.getElementById("nombre").value;
if(!confirm("¿Seguro que quieres eliminar a "+nombre+"?"))return;
try{
await remove(ref(database,"jugadores/"+id));
cancelarEdicion();
}catch(error){console.error(error);alert("No se pudo eliminar el jugador: "+error.message)}
};
</script>
</body>
</html>
