<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin - Ranking 8BP</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:#05090a;

    color:white;
}

.container{

    max-width:1100px;

    margin:auto;

    padding:30px 20px;
}


/* =========================
   HEADER
========================= */

header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#081012;

    border:1px solid #1b3034;

    border-radius:14px;

    padding:18px 22px;

    margin-bottom:25px;
}

.logo{

    font-size:24px;

    font-weight:bold;
}

.logo span{

    color:#9cff00;
}

.admin-email{

    font-size:13px;

    color:#aaa;

    margin-top:5px;
}


/* =========================
   BOTONES
========================= */

button{

    border:0;

    border-radius:8px;

    padding:12px 18px;

    cursor:pointer;

    font-weight:bold;
}

button:hover{

    opacity:.9;
}

.btn-green{

    background:#9cff00;

    color:#000;
}

.btn-red{

    background:#ff3030;

    color:white;
}

.btn-gray{

    background:#263337;

    color:white;
}


/* =========================
   LOGIN
========================= */

.login-box{

    background:#081012;

    border:1px solid #1b3034;

    border-radius:15px;

    padding:30px;

    max-width:420px;

    margin:80px auto;
}

.login-box h1{

    margin-top:0;
}


/* =========================
   ADMIN
========================= */

.admin-box{

    background:#081012;

    border:1px solid #1b3034;

    border-radius:15px;

    padding:25px;

    margin-bottom:25px;
}

.hidden{

    display:none !important;
}


/* =========================
   INPUTS
========================= */

input,
select{

    width:100%;

    padding:13px;

    margin:8px 0 15px;

    border-radius:8px;

    border:1px solid #294348;

    background:#05090a;

    color:white;

    font-size:15px;
}

label{

    display:block;

    font-weight:bold;

    margin-top:10px;
}


/* =========================
   JUGADOR
========================= */

.player{

    display:flex;

    justify-content:space-between;

    align-items:center;

    border:1px solid #1b3034;

    padding:15px;

    border-radius:10px;

    margin-top:10px;

    background:#061012;
}

.player-info{

    display:flex;

    align-items:center;

    gap:15px;

    min-width:0;
}

.avatar{

    width:60px;

    height:60px;

    border-radius:50%;

    object-fit:cover;

    background:#222;

    border:2px solid #294348;
}

.player-name{

    font-size:17px;

    font-weight:bold;
}

.player-country{

    color:#ccc;

    margin-top:4px;

    font-size:14px;
}

.player-stats{

    margin-top:5px;

    font-size:13px;

    color:#aaa;
}

.player-stats .elo{

    color:#9cff00;

    font-weight:bold;
}

.actions{

    display:flex;

    gap:8px;

    flex-shrink:0;
}


/* =========================
   EDITOR
========================= */

.editor{

    background:#081012;

    border:1px solid #9cff00;

    border-radius:15px;

    padding:25px;

    margin-bottom:25px;
}

.editor-title{

    font-size:23px;

    font-weight:bold;

    margin-bottom:20px;
}

.editor-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:5px 20px;
}

.full{

    grid-column:1 / -1;
}

.preview-box{

    display:flex;

    align-items:center;

    gap:20px;

    margin:10px 0 20px;

    padding:15px;

    border:1px solid #1b3034;

    border-radius:10px;
}

.preview{

    width:90px;

    height:90px;

    border-radius:50%;

    object-fit:cover;

    background:#222;

    border:2px solid #9cff00;
}

.editor-buttons{

    display:flex;

    gap:10px;

    margin-top:20px;

    flex-wrap:wrap;
}


/* =========================
   MENSAJES
========================= */

.error{

    color:#ff5252;

    margin-top:10px;
}

.success{

    color:#9cff00;

    margin-top:10px;
}

.info{

    color:#aaa;

    margin-top:10px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .container{

        padding:15px 10px;
    }

    header{

        flex-direction:column;

        align-items:flex-start;

        gap:15px;
    }

    .player{

        flex-direction:column;

        align-items:flex-start;

        gap:15px;
    }

    .actions{

        width:100%;
    }

    .actions button{

        flex:1;
    }

    .editor-grid{

        grid-template-columns:1fr;
    }

    .full{

        grid-column:auto;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginSection"
     class="login-box">

    <h1>🔐 ADMIN 8BP</h1>

    <p>
        Panel de administración del Ranking 8BP
    </p>


    <label>
        Correo
    </label>

    <input
        type="email"
        id="email"
        placeholder="Correo del administrador"
    >


    <label>
        Contraseña
    </label>

    <input
        type="password"
        id="password"
        placeholder="Contraseña"
    >


    <button
        class="btn-green"
        onclick="login()">

        ENTRAR

    </button>


    <div
        id="loginError"
        class="error">
    </div>

</div>



<!-- =====================================================
     ADMIN
===================================================== -->

<div id="adminSection"
     class="hidden">


    <!-- HEADER -->

    <header>

        <div>

            <div class="logo">

                RANKING
                <span>8BP</span>
                ADMIN

            </div>

            <div
                id="adminEmail"
                class="admin-email">

            </div>

        </div>


        <button
            class="btn-red"
            onclick="logout()">

            CERRAR SESIÓN

        </button>

    </header>



    <!-- =================================================
         EDITOR
    ================================================== -->

    <div
        id="editor"
        class="editor hidden">


        <div
            id="editorTitle"
            class="editor-title">

            ✏️ Editar jugador

        </div>


        <!-- ID OCULTO -->

        <input
            type="hidden"
            id="playerId"
        >


        <!-- PREVIEW -->

        <div class="preview-box">

            <img
                id="preview"
                class="preview"
                src=""
                alt="Avatar"
            >

            <div>

                <strong>
                    Vista previa
                </strong>

                <p
                    style="color:#aaa;margin:5px 0 0">

                    Esta será la imagen del jugador.

                </p>

            </div>

        </div>


        <!-- FORMULARIO -->

        <div class="editor-grid">


            <!-- NOMBRE -->

            <div>

                <label>
                    Nombre del jugador
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej: EMANUEL"
                >

            </div>


            <!-- PAÍS -->

            <div>

                <label>
                    País
                </label>

                <input
                    type="text"
                    id="pais"
                    placeholder="Ej: Ecuador"
                >

            </div>


            <!-- CÓDIGO PAÍS -->

            <div>

                <label>
                    Código del país
                </label>

                <input
                    type="text"
                    id="codigoPais"
                    placeholder="Ej: EC"
                    maxlength="5"
                >

            </div>


            <!-- FOTO -->

            <div class="full">

                <label>
                    URL de la foto
                </label>

                <input
                    type="text"
                    id="foto"
                    placeholder="https://..."
                    oninput="actualizarPreview()"
                >

            </div>


            <!-- ELO -->

            <div>

                <label>
                    ELO
                </label>

                <input
                    type="number"
                    id="elo"
                    value="1000"
                >

            </div>


            <!-- VICTORIAS -->

            <div>

                <label>
                    Victorias
                </label>

                <input
                    type="number"
                    id="victorias"
                    value="0"
                >

            </div>


            <!-- DERROTAS -->

            <div>

                <label>
                    Derrotas
                </label>

                <input
                    type="number"
                    id="derrotas"
                    value="0"
                >

            </div>


            <!-- RACHA -->

            <div>

                <label>
                    Racha
                </label>

                <input
                    type="number"
                    id="racha"
                    value="0"
                >

            </div>


            <!-- ÚLTIMO RESULTADO -->

            <div>

                <label>
                    Último resultado
                </label>

                <select id="ultimoResultado">

                    <option value="">
                        Ninguno
                    </option>

                    <option value="VICTORIA">
                        VICTORIA
                    </option>

                    <option value="DERROTA">
                        DERROTA
                    </option>

                </select>

            </div>


            <!-- ÚLTIMO RIVAL -->

            <div>

                <label>
                    Último rival
                </label>

                <input
                    type="text"
                    id="ultimoRival"
                    placeholder="Ej: DELVIN"
                >

            </div>


        </div>


        <!-- BOTONES -->

        <div class="editor-buttons">

            <button
                class="btn-green"
                onclick="guardarJugador()">

                💾 GUARDAR CAMBIOS

            </button>


            <button
                class="btn-gray"
                onclick="cancelarEdicion()">

                CANCELAR

            </button>


            <button
                class="btn-red"
                onclick="eliminarJugador()">

                🗑️ ELIMINAR

            </button>

        </div>


        <div
            id="editorMessage">

        </div>


    </div>



    <!-- =================================================
         JUGADORES
    ================================================== -->

    <div class="admin-box">


        <h2>
            👥 Jugadores
        </h2>


        <button
            class="btn-green"
            onclick="nuevoJugador()">

            + AGREGAR JUGADOR

        </button>


        <div
            id="playersList"
            style="margin-top:20px">

            Cargando jugadores...

        </div>


    </div>


</div>


</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   IMPORTAR FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getAuth,

    signInWithEmailAndPassword,

    onAuthStateChanged,

    signOut

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    getDatabase,

    ref,

    onValue,

    get,

    set,

    push,

    remove

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



/* =====================================================
   CONFIGURACIÓN FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAewmp-duXpfMyL9MenMGxKOAGuUi96phs",

    authDomain:
    "raking8bp.firebaseapp.com",

    databaseURL:
    "https://raking8bp-default-rtdb.firebaseio.com",

    projectId:
    "raking8bp",

    storageBucket:
    "raking8bp.firebasestorage.app",

    messagingSenderId:
    "448167900361",

    appId:
    "1:448167900361:web:9eaa6b20b0fa21108bc918",

    measurementId:
    "G-HVR8GD1RF1"

};



/* =====================================================
   INICIALIZAR
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const database =
    getDatabase(app);



/* =====================================================
   LOGIN
===================================================== */

window.login = async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const error =
        document
        .getElementById("loginError");


    error.textContent = "";


    if(!email || !password){

        error.textContent =
            "Escribe tu correo y contraseña.";

        return;
    }


    try{

        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );

    }

    catch(e){

        console.error(e);

        error.textContent =
            "Correo o contraseña incorrectos.";

    }

};



/* =====================================================
   LOGOUT
===================================================== */

window.logout = async function(){

    await signOut(auth);

};



/* =====================================================
   ESTADO DE AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    (user)=>{


        if(user){


            document
            .getElementById("loginSection")
            .classList
            .add("hidden");


            document
            .getElementById("adminSection")
            .classList
            .remove("hidden");


            document
            .getElementById("adminEmail")
            .textContent =
            "Administrador: " +
            user.email;


            cargarJugadores();


        }

        else{


            document
            .getElementById("loginSection")
            .classList
            .remove("hidden");


            document
            .getElementById("adminSection")
            .classList
            .add("hidden");

        }

    }
);



/* =====================================================
   CARGAR JUGADORES
===================================================== */

function cargarJugadores(){


    const jugadoresRef =
        ref(
            database,
            "jugadores"
        );


    onValue(

        jugadoresRef,

        (snapshot)=>{


            const data =
                snapshot.val();


            const container =
                document
                .getElementById(
                    "playersList"
                );


            container.innerHTML = "";


            if(!data){

                container.innerHTML =

                    "<p class='info'>" +
                    "No hay jugadores registrados todavía." +
                    "</p>";

                return;

            }


            Object
            .entries(data)
            .forEach(
                ([id,jugador])=>{


                    const div =
                        document
                        .createElement("div");


                    div.className =
                        "player";


                    const foto =
                        jugador.foto ||
                        "";


                    const nombre =
                        jugador.nombre ||
                        "SIN NOMBRE";


                    const pais =
                        jugador.pais ||
                        "Sin país";


                    const elo =
                        jugador.elo ??
                        1000;


                    const victorias =
                        jugador.victorias ??
                        0;


                    const derrotas =
                        jugador.derrotas ??
                        0;


                    const racha =
                        jugador.racha ??
                        0;


                    div.innerHTML = `

                        <div class="player-info">

                            <img
                                class="avatar"
                                src="${foto}"
                                onerror="this.style.display='none'"
                                alt=""
                            >

                            <div>

                                <div
                                    class="player-name">

                                    ${nombre}

                                </div>


                                <div
                                    class="player-country">

                                    ${pais}

                                </div>


                                <div
                                    class="player-stats">

                                    <span class="elo">
                                        ELO: ${elo}
                                    </span>

                                    &nbsp; | &nbsp;

                                    ✅ ${victorias}

                                    &nbsp; | &nbsp;

                                    ❌ ${derrotas}

                                    &nbsp; | &nbsp;

                                    🔥 ${racha}

                                </div>

                            </div>

                        </div>


                        <div class="actions">

                            <button
                                class="btn-green"
                                onclick="editarJugador('${id}')">

                                ✏️ EDITAR

                            </button>

                        </div>

                    `;


                    container
                    .appendChild(div);

                }
            );

        }

    );

}



/* =====================================================
   EDITAR JUGADOR
===================================================== */

window.editarJugador =
async function(id){


    console.log(
        "Editando jugador:",
        id
    );


    /* MOSTRAR EDITOR */

    document
    .getElementById("editor")
    .classList
    .remove("hidden");


    document
    .getElementById("editorTitle")
    .textContent =
    "⏳ Cargando jugador...";


    document
    .getElementById("editorMessage")
    .textContent = "";


    /* IR ARRIBA */

    document
    .getElementById("editor")
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    try{


        const jugadorRef =
            ref(
                database,
                "jugadores/" + id
            );


        const snapshot =
            await get(jugadorRef);


        if(!snapshot.exists()){


            alert(
                "No se encontró este jugador en Firebase."
            );


            cancelarEdicion();

            return;

        }


        const jugador =
            snapshot.val();


        console.log(
            "Jugador encontrado:",
            jugador
        );


        /* ID */

        document
        .getElementById("playerId")
        .value =
        id;


        /* NOMBRE */

        document
        .getElementById("nombre")
        .value =
        jugador.nombre || "";


        /* PAÍS */

        document
        .getElementById("pais")
        .value =
        jugador.pais || "";


        /* CÓDIGO PAÍS */

        document
        .getElementById("codigoPais")
        .value =
        jugador.codigoPais || "";


        /* FOTO */

        document
        .getElementById("foto")
        .value =
        jugador.foto || "";


        /* ELO */

        document
        .getElementById("elo")
        .value =
        jugador.elo ?? 1000;


        /* VICTORIAS */

        document
        .getElementById("victorias")
        .value =
        jugador.victorias ?? 0;


        /* DERROTAS */

        document
        .getElementById("derrotas")
        .value =
        jugador.derrotas ?? 0;


        /* RACHA */

        document
        .getElementById("racha")
        .value =
        jugador.racha ?? 0;


        /* ÚLTIMO RESULTADO */

        document
        .getElementById("ultimoResultado")
        .value =
        jugador.ultimoResultado || "";


        /* ÚLTIMO RIVAL */

        document
        .getElementById("ultimoRival")
        .value =
        jugador.ultimoRival || "";


        /* TÍTULO */

        document
        .getElementById("editorTitle")
        .textContent =
        "✏️ Editar jugador";


        /* PREVIEW */

        actualizarPreview();


    }

    catch(error){


        console.error(
            "ERROR:",
            error
        );


        document
        .getElementById("editorMessage")
        .innerHTML =

            "<div class='error'>" +
            "Error: " +
            error.message +
            "</div>";

    }

};



/* =====================================================
   PREVIEW FOTO
===================================================== */

window.actualizarPreview =
function(){


    const foto =
        document
        .getElementById("foto")
        .value
        .trim();


    const preview =
        document
        .getElementById("preview");


    if(foto){

        preview.src =
            foto;

        preview.style.display =
            "block";

    }

    else{

        preview.src = "";

        preview.style.display =
            "none";

    }

};



/* =====================================================
   GUARDAR JUGADOR
===================================================== */

window.guardarJugador =
async function(){


    const id =
        document
        .getElementById("playerId")
        .value;


    if(!id){

        alert(
            "No hay ningún jugador seleccionado."
        );

        return;

    }


    const nombre =
        document
        .getElementById("nombre")
        .value
        .trim();


    const pais =
        document
        .getElementById("pais")
        .value
        .trim();


    const codigoPais =
        document
        .getElementById("codigoPais")
        .value
        .trim()
        .toUpperCase();


    const foto =
        document
        .getElementById("foto")
        .value
        .trim();


    const elo =
        Number(
            document
            .getElementById("elo")
            .value
        );


    const victorias =
        Number(
            document
            .getElementById("victorias")
            .value
        );


    const derrotas =
        Number(
            document
            .getElementById("derrotas")
            .value
        );


    const racha =
        Number(
            document
            .getElementById("racha")
            .value
        );


    const ultimoResultado =
        document
        .getElementById("ultimoResultado")
        .value;


    const ultimoRival =
        document
        .getElementById("ultimoRival")
        .value
        .trim();


    if(!nombre){

        alert(
            "Escribe el nombre del jugador."
        );

        return;

    }


    const jugador = {


        nombre:
            nombre,


        pais:
            pais,


        codigoPais:
            codigoPais,


        foto:
            foto,


        elo:
            isNaN(elo)
            ? 1000
            : elo,


        victorias:
            isNaN(victorias)
            ? 0
            : victorias,


        derrotas:
            isNaN(derrotas)
            ? 0
            : derrotas,


        racha:
            isNaN(racha)
            ? 0
            : racha,


        ultimoResultado:
            ultimoResultado,


        ultimoRival:
            ultimoRival

    };


    try{


        await set(

            ref(
                database,
                "jugadores/" + id
            ),

            jugador

        );


        document
        .getElementById("editorMessage")
        .innerHTML =

            "<div class='success'>" +
            "✅ Jugador guardado correctamente." +
            "</div>";


        document
        .getElementById("editorTitle")
        .textContent =
        "✏️ Editar jugador";


    }

    catch(error){


        console.error(error);


        document
        .getElementById("editorMessage")
        .innerHTML =

            "<div class='error'>" +
            "❌ Error al guardar: " +
            error.message +
            "</div>";

    }

};



/* =====================================================
   NUEVO JUGADOR
===================================================== */

window.nuevoJugador =
async function(){


    try{


        const jugadoresRef =
            ref(
                database,
                "jugadores"
            );


        const nuevoRef =
            push(jugadoresRef);


        const nuevoJugador = {

            nombre:
                "NUEVO JUGADOR",

            pais:
                "",

            codigoPais:
                "",

            foto:
                "",

            elo:
                1000,

            victorias:
                0,

            derrotas:
                0,

            racha:
                0,

            ultimoResultado:
                "",

            ultimoRival:
                ""

        };


        await set(
            nuevoRef,
            nuevoJugador
        );


        editarJugador(
            nuevoRef.key
        );


    }

    catch(error){

        console.error(error);

        alert(
            "No se pudo crear el jugador: " +
            error.message
        );

    }

};



/* =====================================================
   CANCELAR EDICIÓN
===================================================== */

window.cancelarEdicion =
function(){


    document
    .getElementById("editor")
    .classList
    .add("hidden");


    document
    .getElementById("playerId")
    .value = "";


    document
    .getElementById("editorMessage")
    .textContent = "";

};



/* =====================================================
   ELIMINAR JUGADOR
===================================================== */

window.eliminarJugador =
async function(){


    const id =
        document
        .getElementById("playerId")
        .value;


    const nombre =
        document
        .getElementById("nombre")
        .value;


    if(!id){

        alert(
            "No hay ningún jugador seleccionado."
        );

        return;

    }


    const confirmar =
        confirm(

            "¿Seguro que quieres eliminar a " +
            nombre +
            "?\n\n" +
            "Esta acción no se puede deshacer."

        );


    if(!confirmar){

        return;

    }


    try{


        await remove(

            ref(
                database,
                "jugadores/" + id
            )

        );


        cancelarEdicion();


        alert(
            "Jugador eliminado correctamente."
        );


    }

    catch(error){


        console.error(error);


        alert(

            "No se pudo eliminar el jugador: " +
            error.message

        );

    }

};


</script>
